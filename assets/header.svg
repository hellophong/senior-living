<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" width="1600" height="300" role="img" aria-hidden="true">
  <title>Placeholder banner — swap for the final illustration</title>

  <!-- Ground: matches the page background exactly so the band blends in -->
  <rect x="0" y="0" width="1600" height="300" fill="#f5efe6" />

  <!-- Sun -->
  <circle cx="1190" cy="112" r="66" fill="#d8a544" />

  <!-- A few birds, just for a little life in the sky -->
  <path d="M240 70 q14 -14 28 0 q14 -14 28 0" fill="none" stroke="#6f5f52" stroke-width="4" stroke-linecap="round" />
  <path d="M300 100 q11 -11 22 0 q11 -11 22 0" fill="none" stroke="#6f5f52" stroke-width="4" stroke-linecap="round" />
  <path d="M960 56 q12 -12 24 0 q12 -12 24 0" fill="none" stroke="#6f5f52" stroke-width="4" stroke-linecap="round" />

  <!-- Downtown skyline, flat rectangles of varying height along the horizon -->
  <g>
    <rect x="840"  y="150" width="46" height="100" fill="#33587e" />
    <rect x="896"  y="120" width="40" height="130" fill="#332822" />
    <rect x="946"  y="165" width="34" height="85"  fill="#33587e" />
    <rect x="990"  y="100" width="52" height="150" fill="#332822" />
    <rect x="1052" y="140" width="38" height="110" fill="#33587e" />
    <rect x="1260" y="160" width="42" height="90"  fill="#332822" />
    <rect x="1312" y="130" width="36" height="120" fill="#33587e" />
    <rect x="1358" y="172" width="30" height="78"  fill="#332822" />
    <!-- windows -->
    <g fill="#f5efe6">
      <rect x="905" y="134" width="8" height="8" />
      <rect x="921" y="134" width="8" height="8" />
      <rect x="905" y="156" width="8" height="8" />
      <rect x="921" y="156" width="8" height="8" />
      <rect x="1002" y="116" width="8" height="8" />
      <rect x="1022" y="116" width="8" height="8" />
      <rect x="1002" y="140" width="8" height="8" />
      <rect x="1022" y="140" width="8" height="8" />
      <rect x="1322" y="146" width="8" height="8" />
      <rect x="1322" y="168" width="8" height="8" />
    </g>
  </g>

  <!-- Rolling ground the skyline and trees sit on -->
  <path d="M0 232 Q 400 200 800 228 T 1600 224 V300 H0 Z" fill="#efe4d4" />

  <!-- The James River, a flat teal ribbon along the foot of the scene -->
  <path d="M0 268 Q 220 244 460 266 T 900 262 T 1340 268 T 1600 260 V300 H0 Z" fill="#2f7d6b" />
  <path d="M0 284 Q 260 266 560 282 T 1080 280 T 1600 278 V300 H0 Z" fill="#2f7d6b" opacity=".55" />

  <!-- Tree canopy, Richmond's park-city character -->
  <g fill="#4b7a4e">
    <circle cx="120" cy="196" r="34" />
    <circle cx="160" cy="210" r="26" />
    <circle cx="90"  cy="216" r="22" />
    <circle cx="1470" cy="200" r="30" />
    <circle cx="1508" cy="214" r="22" />
  </g>
  <g fill="#332822">
    <rect x="114" y="220" width="10" height="26" />
    <rect x="1464" y="220" width="10" height="24" />
  </g>

  <!-- An open book resting on the riverbank — the next chapter -->
  <g transform="translate(360 216)">
    <path d="M0 40 L94 18 L94 40 L0 62 Z" fill="#7c2d3a" />
    <path d="M188 40 L94 18 L94 40 L188 62 Z" fill="#5c202b" />
    <path d="M4 38 L90 18" fill="none" stroke="#f5efe6" stroke-width="2" opacity=".5" />
    <path d="M184 38 L98 18" fill="none" stroke="#f5efe6" stroke-width="2" opacity=".5" />
    <line x1="94" y1="18" x2="94" y2="40" stroke="#332822" stroke-width="2" />
  </g>
</svg>
