<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-hidden="true">
  <title>Placeholder photo — rowhouse exterior</title>
  <rect width="400" height="300" fill="#f5efe6" />
  <rect x="0" y="240" width="400" height="60" fill="#dccdb3" />
  <!-- brick rowhouse, three bays -->
  <g stroke="#332822" stroke-width="3">
    <rect x="60"  y="70"  width="90" height="170" fill="#b8502c" />
    <rect x="155" y="50"  width="90" height="190" fill="#a1452a" />
    <rect x="250" y="80"  width="90" height="160" fill="#b8502c" />
  </g>
  <!-- porch -->
  <rect x="140" y="200" width="120" height="40" fill="#efe4d4" stroke="#332822" stroke-width="2" />
  <g stroke="#332822" stroke-width="3">
    <line x1="150" y1="200" x2="150" y2="240" />
    <line x1="200" y1="200" x2="200" y2="240" />
    <line x1="250" y1="200" x2="250" y2="240" />
  </g>
  <!-- door -->
  <rect x="185" y="180" width="30" height="42" fill="#5c202b" />
  <!-- windows -->
  <g fill="#9fc7c2" stroke="#332822" stroke-width="2">
    <rect x="82"  y="98"  width="26" height="34" />
    <rect x="82"  y="150" width="26" height="34" />
    <rect x="178" y="78"  width="26" height="34" />
    <rect x="178" y="128" width="26" height="34" />
    <rect x="270" y="106" width="26" height="34" />
    <rect x="270" y="158" width="26" height="34" />
  </g>
  <!-- iron railing flourish -->
  <path d="M60 240 h280" stroke="#332822" stroke-width="2" fill="none" />
</svg>
